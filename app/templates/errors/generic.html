{% extends "base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center animate-fade-in">
  <div class="bg-white dark:bg-gray-800 p-10 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 max-w-md">
    <p class="text-6xl font-bold text-green-600 mb-4">{{ code }}</p>
    <p class="text-gray-600 dark:text-gray-300 mb-6">{{ message }}</p>
    <a href="{{ url_for('main.landing') }}" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-xl font-medium transition-colors">
      Back to Home
    </a>
  </div>
</div>
{% endblock %}
