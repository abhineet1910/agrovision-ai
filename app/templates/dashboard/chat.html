{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto flex flex-col h-[75vh] animate-fade-in">
  <div class="text-center mb-4">
    <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-1">Agri-Chat AI</h2>
    <p class="text-gray-500 dark:text-gray-400">Ask anything about crops, fertilizer, or irrigation.</p>
  </div>

  <div id="chat-messages" class="flex-1 overflow-y-auto bg-white dark:bg-gray-800 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-4 mb-4">
    {% if not messages %}
      <p class="text-center text-gray-400 text-sm">Start the conversation — ask a question below.</p>
    {% endif %}
    {% for m in messages %}
      <div class="flex {{ 'justify-end' if m.role == 'user' else 'justify-start' }}">
        <div class="max-w-[80%] px-4 py-2.5 rounded-2xl text-sm {{ 'bg-green-600 text-white' if m.role == 'user' else 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100' }}">
          {{ m.text }}
        </div>
      </div>
    {% endfor %}
  </div>

  <form id="chat-form" class="flex gap-3">
    <input id="chat-input" type="text" placeholder="Ask Agri-Chat..." autocomplete="off"
           class="flex-1 px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500" />
    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold transition-colors">
      Send
    </button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
