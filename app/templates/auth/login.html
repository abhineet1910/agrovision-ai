{% extends "base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] animate-fade-in">
  <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-900 dark:text-white">Sign in to AgroVision</h2>

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">Email</label>
        <input type="email" name="email" required value="{{ email or '' }}"
               class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500" />
      </div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold mb-1 transition-colors">
        Log In
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="text-green-600 font-semibold hover:underline">Sign up</a>
    </p>
    <a href="{{ url_for('main.landing') }}" class="block text-center w-full text-gray-500 text-sm hover:underline mt-4">
      Back to Home
    </a>
  </div>
</div>
{% endblock %}
